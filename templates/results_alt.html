<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Results — Minimal Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles_alt.css">
    <style>
      .chart-container {
        background-color: #2d2d2d;
        border: 2px solid #444;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        text-align: center;
      }
      .chart-container img {
        max-width: 100%;
        height: auto;
        border-radius: 6px;
      }
      .chart-title {
        color: #e0e0e0;
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body class="alt-bg">
    <div class="alt-container">
      <header class="alt-header">
        <h1 class="alt-title">Predictions</h1>
        <p class="alt-sub">Results for <strong>{{ filename }}</strong></p>
      </header>

      <main class="alt-main">
        <div class="alt-actions">
          <a href="{{ url_for('index') }}" class="alt-link">Upload another</a>
        </div>

        <section class="chart-container">
          <div class="chart-title">Pass/Fail Distribution</div>
          <img src="{{ chart_image }}" alt="Pass/Fail Distribution Charts">
        </section>

        <section class="alt-table">
          {{ table_html | safe }}
        </section>
      </main>
    </div>
  </body>
  </html>
