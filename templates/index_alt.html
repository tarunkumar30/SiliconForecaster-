<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload CSV — Minimal Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles_alt.css">
    
  </head>
  <body class="alt-bg">
    <div class="alt-container">
      <header class="alt-header">
        <h1 class="alt-title">“Smart Yield Prediction in Semiconductor Manufacturing”  </h1>
        <p class="alt-sub">Upload a CSV and get predictions.</p>
      </header>

      <main class="alt-main">
          {% if popup_message %}
            <script>alert("{{ popup_message|e }}");</script>
          {% endif %}

        <form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data" class="alt-form">
          <label for="file" class="form-label visually-hidden">CSV file</label>
          <input class="alt-label" type="file" id="file" name="file" accept=".csv" required>
          <button class="alt-btn" type="submit">Predict</button>
        </form>
      </main>
    </div>
  </body>
  </html>
